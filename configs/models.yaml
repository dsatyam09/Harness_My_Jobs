# One vLLM server per model. Ports are examples; match them to scripts/serve_vllm.sh.
# Sampling follows each model card's recommendation; change only if you document why.
gpt-oss-120b:
  base_url: http://localhost:8000/v1
  model: openai/gpt-oss-120b
  temperature: 1.0
  max_tokens: 2048
  extra_body: {reasoning_effort: low}
gpt-oss-20b:
  base_url: http://localhost:8001/v1
  model: openai/gpt-oss-20b
  temperature: 1.0
  max_tokens: 2048
  extra_body: {reasoning_effort: low}
qwen3-30b-a3b:
  base_url: http://localhost:8002/v1
  model: Qwen/Qwen3-30B-A3B-Instruct-2507
  temperature: 0.7
  max_tokens: 2048

# --- Small-model study (Milestone 2 pilot, 2026-11-10): all models 1-3B dense, served on one H100 ---
# Replaces the 20B/30B/120B plan: weights too large for the team's time and storage budget.
qwen2.5-3b:
  base_url: http://localhost:8010/v1
  model: Qwen/Qwen2.5-3B-Instruct
  temperature: 0.7
  max_tokens: 1536
qwen2.5-1.5b:
  base_url: http://localhost:8011/v1
  model: Qwen/Qwen2.5-1.5B-Instruct
  temperature: 0.7
  max_tokens: 1536
qwen3-1.7b:
  base_url: http://localhost:8012/v1
  model: Qwen/Qwen3-1.7B
  temperature: 0.7
  max_tokens: 1536
  extra_body: {chat_template_kwargs: {enable_thinking: false}}
